<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pafoos AI</title>
<meta name="theme-color" content="#060607">
<style>
:root{
  --bg:#060607; --panel:rgba(18,18,20,.72); --line:rgba(217,169,69,.16);
  --gold:#d9a945; --gold-2:#f6dd8f; --gold-3:#8e6420;
  --text:#ece6d6; --muted:#8d877a;
  --grad:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,var(--gold-3));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(40% 35% at 20% 10%,rgba(217,169,69,.10),transparent 70%),
             radial-gradient(35% 30% at 85% 90%,rgba(217,169,69,.08),transparent 70%);
  animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate(4%,-3%) rotate(6deg)}}

/* ---------- Робот ---------- */
.robot{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 10px rgba(217,169,69,.35))}
.robot path,.robot .r-stroke{fill:none;stroke:url(#pfGold);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.robot .r-fill{fill:url(#pfGold)}
.robot .r-eyes ellipse{fill:#0b0b0c}
.robot .r-body{animation:float 4s ease-in-out infinite}
.robot .r-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.robot .r-ball{fill:var(--gold-2);animation:glow 2.2s ease-in-out infinite}
.robot .r-ant-r .r-ball{animation-delay:1.1s}
.robot .r-core{transform-box:fill-box;transform-origin:center;animation:core 2.4s ease-in-out infinite}
.robot .r-arm{transform-box:view-box}
.robot .r-arm-l{transform-origin:80px 128px;animation:waveL 3.2s ease-in-out infinite}
.robot .r-arm-r{transform-origin:120px 128px;animation:waveR 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes core{50%{transform:scale(1.35);opacity:.7}}
@keyframes waveL{50%{transform:rotate(-8deg)}}
@keyframes waveR{50%{transform:rotate(8deg)}}
.busy .robot .r-eyes{animation:look 1.4s ease-in-out infinite}
.busy .robot .r-ball{animation-duration:.7s}
@keyframes look{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}

.brand-text{font-weight:700;letter-spacing:.32em;white-space:nowrap;
  background:linear-gradient(100deg,var(--gold-3),var(--gold) 30%,#fff3c4 50%,var(--gold) 70%,var(--gold-3));
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 5s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0% 0}}

/* ---------- Заставка ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:18px;background:var(--bg);transition:opacity .7s ease,visibility .7s}
#splash{animation:splashOut .7s 3s forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
#splash.hide{opacity:0;visibility:hidden}
.splash-logo{width:170px;animation:pop 1.1s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px);filter:blur(12px)}}
.brand-text.big{font-size:26px;animation:shine 3s linear infinite,rise .9s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(12px);letter-spacing:.8em}}
.splash-bar{width:160px;height:2px;background:rgba(217,169,69,.15);border-radius:2px;overflow:hidden}
.splash-bar span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);animation:load 1.1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

/* ---------- Каркас ---------- */
.app{position:relative;z-index:1;display:flex;height:100%}
.sidebar{width:270px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;padding:18px 14px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.mini-logo{width:40px}
.side-brand .brand-text{font-size:14px}
.btn-new{position:relative;overflow:hidden;padding:11px 14px;border-radius:14px;border:1px solid rgba(217,169,69,.4);background:linear-gradient(135deg,rgba(217,169,69,.18),rgba(217,169,69,.04));font-weight:600;color:var(--gold-2);transition:.25s}
.btn-new:hover{box-shadow:0 0 24px rgba(217,169,69,.25);transform:translateY(-1px)}
.btn-new::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,240,190,.25) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
.btn-new:hover::after{transform:translateX(100%)}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.chat-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;color:var(--muted);cursor:pointer;transition:.2s;animation:slideIn .35s both}
.chat-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.chat-item.active{background:rgba(217,169,69,.1);color:var(--gold-2);box-shadow:inset 2px 0 0 var(--gold)}
.chat-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chat-item .del{opacity:0;padding:0 4px;color:var(--muted);transition:.2s}
.chat-item:hover .del{opacity:1}
.chat-item .del:hover{color:#e57373}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}}
.btn-ghost{padding:10px 12px;border-radius:12px;text-align:left;color:var(--muted);transition:.2s}
.btn-ghost:hover{background:rgba(255,255,255,.04);color:var(--text)}
.overlay{display:none}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(6,6,7,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,.06)}
.burger{display:none;position:absolute;left:14px}
.switch{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);width:220px}
.switch button{position:relative;z-index:1;padding:7px 0;font-weight:600;font-size:14px;color:var(--muted);transition:color .3s}
.switch button.on{color:#1a1206}
.glider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--grad);box-shadow:0 4px 18px rgba(217,169,69,.35);transition:transform .45s cubic-bezier(.5,1.6,.4,.8)}
.switch[data-p="groq"] .glider{transform:translateX(100%)}
.model-id{position:absolute;right:18px;max-width:28%;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Сообщения ---------- */
.messages{flex:1;overflow-y:auto;padding:28px 18px 10px}
.messages>*{max-width:820px;margin-left:auto;margin-right:auto}
.msg{display:flex;gap:12px;margin-bottom:22px}
.msg.in{animation:msgIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.98);filter:blur(6px)}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{max-width:80%;padding:10px 16px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,rgba(217,169,69,.22),rgba(217,169,69,.08));border:1px solid rgba(217,169,69,.3);white-space:pre-wrap;overflow-wrap:anywhere}
.avatar{width:36px;height:36px;flex-shrink:0;padding:3px;border-radius:12px;background:rgba(217,169,69,.08);border:1px solid var(--line)}
.col{flex:1;min-width:0}
.msg.ai .bubble{padding:4px 2px;overflow-wrap:anywhere}
.bubble p{margin:0 0 .7em}.bubble p:last-child{margin-bottom:0}
.bubble h3,.bubble h4,.bubble h5{color:var(--gold-2);margin:.8em 0 .4em;line-height:1.3}
.bubble ul,.bubble ol{margin:.2em 0 .8em 1.4em}
.bubble li{margin:.2em 0}
.bubble li::marker{color:var(--gold)}
.bubble a{color:var(--gold-2)}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:rgba(217,169,69,.1);padding:.1em .4em;border-radius:6px;color:var(--gold-2)}
.code{margin:.6em 0 1em;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0d0d0f}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
.code-head button{font-size:12px;color:var(--gold)}
.code pre{padding:14px;overflow-x:auto}
.code pre code{background:none;padding:0;color:#e9e3d2;font-size:13px}
.streaming .bubble>:last-child:not(.typing):not(.code)::after{content:"";display:inline-block;width:8px;height:16px;margin-left:3px;vertical-align:-3px;background:var(--gold);border-radius:2px;animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.meta{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);opacity:0;transition:.25s}
.msg.ai:hover .meta{opacity:1}
.meta button{color:var(--muted)}.meta button:hover{color:var(--gold-2)}
.bubble.error{color:#f0a3a3}
.typing{display:flex;gap:5px;padding:10px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}

.empty{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;animation:msgIn .7s both}
.empty .hero{width:150px;margin-bottom:6px}
.empty h1{font-size:28px;letter-spacing:.02em}
.empty p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px;max-width:620px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;transition:.25s;animation:msgIn .5s both}
.chip:hover{border-color:rgba(217,169,69,.5);background:rgba(217,169,69,.1);transform:translateY(-2px);box-shadow:0 6px 20px rgba(217,169,69,.15)}

/* ---------- Поле ввода ---------- */
.composer{padding:10px 18px 16px}
.input-wrap{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 18px;border-radius:22px;background:rgba(20,20,23,.8);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .3s,box-shadow .3s}
.input-wrap:focus-within{border-color:rgba(217,169,69,.55);box-shadow:0 0 0 4px rgba(217,169,69,.08),0 10px 40px rgba(217,169,69,.12)}
textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--text);font:inherit;max-height:200px;padding:8px 0}
textarea::placeholder{color:var(--muted)}
.send{width:42px;height:42px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:#1a1206;transition:transform .2s,box-shadow .3s}
.send:hover{transform:scale(1.06);box-shadow:0 0 22px rgba(217,169,69,.45)}
.send:active{transform:scale(.94)}
.send .i-stop{display:none}
.send.stop .i-send{display:none}.send.stop .i-stop{display:block}
.send.stop{animation:ring 1.6s infinite}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(217,169,69,.5)}to{box-shadow:0 0 0 14px rgba(217,169,69,0)}}
.hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}

/* ---------- Настройки и уведомления ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.3s}
.modal.open{opacity:1;visibility:visible}
.card{width:min(460px,92vw);max-height:92vh;overflow-y:auto;padding:24px;border-radius:22px;background:#111113;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateY(20px) scale(.96);transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}
.modal.open .card{transform:none}
.card h2{font-size:18px;margin-bottom:4px}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.card fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-bottom:14px}
.card legend{padding:0 6px;color:var(--gold-2);font-weight:600;font-size:14px}
.card label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.card input{width:100%;padding:10px 12px;border-radius:10px;background:#0a0a0b;border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;outline:0;transition:.2s}
.card input:focus{border-color:var(--gold)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.btn{padding:10px 18px;border-radius:12px;font-weight:600;transition:.2s}
.btn.primary{background:var(--grad);color:#1a1206}
.btn.primary:hover{box-shadow:0 0 20px rgba(217,169,69,.4)}
.btn.secondary{border:1px solid var(--line);color:var(--muted)}
.btn.secondary:hover{color:var(--text)}
.toast{position:fixed;left:50%;bottom:100px;z-index:60;transform:translate(-50%,20px);padding:10px 18px;border-radius:12px;background:#1a1a1d;border:1px solid rgba(217,169,69,.4);color:var(--gold-2);font-size:14px;opacity:0;pointer-events:none;transition:.35s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .overlay{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:.3s}
  .overlay.show{opacity:1;visibility:visible}
  .burger{display:grid}
  .model-id,.hint{display:none}
  .composer{padding-bottom:max(16px,env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="pfGold" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="160" y2="180">
      <stop offset="0" stop-color="#fbe9a4"/>
      <stop offset=".45" stop-color="#d9a945"/>
      <stop offset="1" stop-color="#8e6420"/>
    </linearGradient>
  </defs>
</svg>

<canvas id="bg"></canvas>

<div id="splash">
  <div class="splash-logo" id="splashLogo"></div>
  <div class="brand-text big">PAFOOS AI</div>
  <div class="splash-bar"><span></span></div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand"><div class="mini-logo" id="sideLogo"></div><span class="brand-text">PAFOOS AI</span></div>
    <button class="btn-new" id="newChat">+ Новый чат</button>
    <div class="chat-list" id="chatList"></div>
    <button class="btn-ghost" id="openSettings">⚙ Настройки</button>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn burger" id="burger" aria-label="Меню">☰</button>
      <div class="switch" id="switch" data-p="claude">
        <div class="glider"></div>
        <button data-p="claude">Claude</button>
        <button data-p="groq">Groq</button>
      </div>
      <div class="model-id" id="modelId"></div>
    </header>

    <section class="messages" id="messages"></section>

    <footer class="composer">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
        <button class="send" id="sendBtn" aria-label="Отправить">
          <svg class="i-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
        </button>
      </div>
      <div class="hint">Enter — отправить, Shift+Enter — новая строка</div>
    </footer>
  </main>
</div>

<div class="modal" id="settings">
  <form class="card" id="settingsForm">
    <h2>Настройки</h2>
    <p class="sub">Ключи хранятся только в этом браузере (localStorage) и отправляются напрямую в API провайдера.</p>
    <fieldset>
      <legend>Claude (Anthropic)</legend>
      <label for="claudeKey">API-ключ</label>
      <input id="claudeKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <label for="claudeModel">Модель</label>
      <input id="claudeModel" spellcheck="false">
    </fieldset>
    <fieldset>
      <legend>Groq</legend>
      <label for="groqKey">API-ключ</label>
      <input id="groqKey" type="password" autocomplete="off" placeholder="gsk_...">
      <label for="groqModel">Модель</label>
      <input id="groqModel" spellcheck="false">
    </fieldset>
    <div class="actions">
      <button type="button" class="btn secondary" id="closeSettings">Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const SYSTEM_PROMPT = 'Ты — Pafoos AI, дружелюбный личный ИИ-помощник. Отвечай на языке пользователя, понятно и по делу.';
const PROVIDERS = { claude: 'Claude', groq: 'Groq' };
const DEFAULTS = { claudeKey: '', claudeModel: 'claude-sonnet-4-5', groqKey: '', groqModel: 'llama-3.3-70b-versatile' };
const SUGGESTIONS = ['Объясни простыми словами, как работает ИИ', 'Помоги написать пост для Telegram', 'Придумай 5 идей для стартапа', 'Найди ошибку в моём коде'];

const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

let settings = { ...DEFAULTS, ...LS.get('pf_settings', {}) };
let chats = LS.get('pf_chats', []);
let currentId = LS.get('pf_current', null);
let provider = LS.get('pf_provider', 'claude');
let controller = null;
if (!chats.some(c => c.id === currentId)) currentId = null;

/* ---------- Логотип ---------- */
function robotSVG(cls = '') {
  return `<svg class="robot ${cls}" viewBox="0 0 200 190" aria-hidden="true"><g class="r-body">
    <g class="r-ant r-ant-l"><path d="M74 60 L58 44 V31"/><circle class="r-ball" cx="58" cy="24" r="6"/></g>
    <g class="r-ant r-ant-r"><path d="M126 60 L142 44 V31"/><circle class="r-ball" cx="142" cy="24" r="6"/></g>
    <rect class="r-stroke" x="62" y="56" width="76" height="60" rx="24"/>
    <rect class="r-fill" x="52" y="78" width="10" height="16" rx="3"/>
    <rect class="r-fill" x="138" y="78" width="10" height="16" rx="3"/>
    <rect class="r-fill" x="75" y="70" width="50" height="32" rx="16"/>
    <g class="r-eyes"><ellipse cx="89" cy="86" rx="7" ry="8"/><ellipse cx="111" cy="86" rx="7" ry="8"/></g>
    <path d="M80 122 H120 Q122 148 100 150 Q78 148 80 122 Z"/>
    <circle class="r-fill r-core" cx="100" cy="134" r="6"/>
    <g class="r-arm r-arm-l"><path d="M80 128 L60 118 L52 141"/><circle class="r-fill" cx="52" cy="148" r="5"/></g>
    <g class="r-arm r-arm-r"><path d="M120 128 L140 118 L148 141"/><circle class="r-fill" cx="148" cy="148" r="5"/></g>
    <path d="M92 150 L86 169"/><circle class="r-fill" cx="85" cy="176" r="5"/>
    <path d="M108 150 L114 169"/><circle class="r-fill" cx="115" cy="176" r="5"/>
  </g></svg>`;
}

/* ---------- Безопасный Markdown ---------- */
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function md(src) {
  const blocks = [];
  src = src.replace(/
([\w+-]*)\n?([\s\S]*?)(
|$)/g, (m, lang, code) => {
    blocks.push({ lang, code: code.replace(/\n$/, '') });
    return `\u0000${blocks.length - 1}\u0000`;
  });
  let html = esc(src)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  let out = '', list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const line of html.split('\n')) {
    let m;
    if (/^\u0000\d+\u0000$/.test(line.trim())) { closeList(); out += line.trim(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)/))) { closeList(); const n = m[1].length + 2; out += `<h${n}>${m[2]}</h${n}>`; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${m[1]}</li>`; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${m[1]}</li>`; continue; }
    closeList();
    if (line.trim()) out += `<p>${line}</p>`;
  }
  closeList();
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => {
    const b = blocks[i];
    return `<div class="code"><div class="code-head"><span>${esc(b.lang || 'code')}</span><button type="button">Копировать</button></div><pre><code>${esc(b.code)}</code></pre></div>`;
  });
}

/* ---------- Состояние ---------- */
const current = () => chats.find(c => c.id === currentId);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function saveChats() { LS.set('pf_chats', chats); LS.set('pf_current', currentId); }

function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}

function setProvider(p) {
  provider = p;
  LS.set('pf_provider', p);
  $('#switch').dataset.p = p;
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  $('#modelId').textContent = p === 'claude' ? settings.claudeModel : settings.groqModel;
}

/* ---------- Отрисовка ---------- */
function renderList() {
  const box = $('#chatList');
  box.innerHTML = '';
  [...chats].sort((a, b) => b.updated - a.updated).forEach((c, i) => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === currentId ? ' active' : '');
    item.style.animationDelay = i * 30 + 'ms';
    const title = document.createElement('span');
    title.textContent = c.title || 'Новый чат';
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = 'Удалить';
    del.onclick = e => {
      e.stopPropagation();
      if (!confirm('Удалить этот чат?')) return;
      chats = chats.filter(x => x.id !== c.id);
      if (currentId === c.id) currentId = null;
      saveChats(); renderList(); renderChat();
    };
    item.onclick = () => {
      if (controller) return toast('Дождитесь окончания ответа');
      currentId = c.id; saveChats(); renderList(); renderChat(); closeSidebar();
    };
    item.append(title, del);
    box.appendChild(item);
  });
}

function emptyState() {
  const el = document.createElement('div');
  el.className = 'empty';
  el.innerHTML = `${robotSVG('hero')}<h1 class="brand-text" style="letter-spacing:.04em">Чем могу помочь?</h1><p>Выберите модель вверху и задайте вопрос</p><div class="chips"></div>`;
  const chips = el.querySelector('.chips');
  SUGGESTIONS.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.q = q;
    b.textContent = q;
    b.style.animationDelay = 200 + i * 80 + 'ms';
    chips.appendChild(b);
  });
  return el;
}

function addMessage(role, content, prov, animate = true) {
  const box = $('#messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai') + (animate ? ' in' : '');
  wrap._raw = content;
  let bubble;
  if (role === 'user') {
    bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;
    wrap.appendChild(bubble);
  } else {
    wrap.innerHTML = `<div class="avatar">${robotSVG()}</div><div class="col"><div class="bubble"></div><div class="meta"><span>${PROVIDERS[prov] || ''}</span><button type="button" class="msg-copy">Копировать</button></div></div>`;
    bubble = wrap.querySelector('.bubble');
    bubble.innerHTML = md(content);
  }
  box.appendChild(wrap);
  scrollDown();
  return { wrap, bubble };
}

function renderChat() {
  const box = $('#messages');
  box.innerHTML = '';
  const c = current();
  if (!c || !c.messages.length) { box.appendChild(emptyState()); return; }
  c.messages.forEach(m => addMessage(m.role, m.content, m.provider, false));
  box.scrollTop = box.scrollHeight;
}

const nearBottom = () => { const b = $('#messages'); return b.scrollHeight - b.scrollTop - b.clientHeight < 120; };
const scrollDown = () => { const b = $('#messages'); b.scrollTop = b.scrollHeight; };

/* ---------- API ---------- */
async function errorText(res) {
  try { const j = await res.json(); return j.error?.message || `HTTP ${res.status}`; }
  catch { return `HTTP ${res.status}`; }
}

async function readSSE(res, onData) {
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const l of lines) {
      const s = l.trim();
      if (!s.startsWith('data:')) continue;
      const d = s.slice(5).trim();
      if (d === '[DONE]') return;
      if (d) onData(JSON.parse(d));
    }
  }
}

async function streamClaude(messages, onDelta, signal) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST', signal,
    headers: {
      'content-type': 'application/json',
      'x-api-key': settings.claudeKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({ model: settings.claudeModel, max_tokens: 4096, system: SYSTEM_PROMPT, messages, stream: true })
  });
  if (!res.ok) throw new Error(await errorText(res));
  await readSSE(res, j => {
    if (j.type === 'content_block_delta' && j.delta?.type === 'text_delta') onDelta(j.delta.text);
    if (j.type === 'error') throw new Error(j.error?.message || 'Ошибка API');
  });
}

async function streamGroq(messages, onDelta, signal) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST', signal,
    headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + settings.groqKey },
    body: JSON.stringify({ model: settings.groqModel, messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages], stream: true })
  });
  if (!res.ok) throw new Error(await errorText(res));
  await readSSE(res, j => {
    const t = j.choices?.[0]?.delta?.content;
    if (t) onDelta(t);
  });
}

/* ---------- Отправка ---------- */
function setBusy(on) {
  $('#sendBtn').classList.toggle('stop', on);
  $('#sendBtn').setAttribute('aria-label', on ? 'Остановить' : 'Отправить');
  $('.side-brand').classList.toggle('busy', on);
}

async function send(text) {
  text = (text || '').trim();
  if (!text || controller) return;
  const key = provider === 'claude' ? settings.claudeKey : settings.groqKey;
  if (!key) { toast(`Добавьте API-ключ ${PROVIDERS[provider]} в настройках`); openSettings(); return; }

  let c = current();
  if (!c) {
    c = { id: uid(), title: '', messages: [], updated: Date.now() };
    chats.push(c);
    currentId = c.id;
  }
  if (!c.messages.length) { $('#messages').innerHTML = ''; c.title = text.slice(0, 40); }
  c.messages.push({ role: 'user', content: text });
  c.updated = Date.now();
  saveChats(); renderList();

  input.value = ''; autoResize();
  addMessage('user', text);
  const used = provider;
  const { wrap, bubble } = addMessage('assistant', '', used);
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.classList.add('streaming');
  setBusy(true);
  controller = new AbortController();

  const history = c.messages.map(m => ({ role: m.role, content: m.content }));
  let full = '';
  const onDelta = t => {
    full += t;
    wrap._raw = full;
    const stick = nearBottom();
    bubble.innerHTML = md(full);
    if (stick) scrollDown();
  };

  try {
    if (used === 'claude') await streamClaude(history, onDelta, controller.signal);
    else await streamGroq(history, onDelta, controller.signal);
    if (!full) throw new Error('Пустой ответ');
    c.messages.push({ role: 'assistant', content: full, provider: used });
  } catch (e) {
    if (e.name === 'AbortError' && full) {
      c.messages.push({ role: 'assistant', content: full, provider: used });
    } else {
      c.messages.pop();
      bubble.classList.add('error');
      bubble.textContent = e.name === 'AbortError' ? 'Остановлено.' : 'Ошибка: ' + e.message;
      if (!input.value) { input.value = text; autoResize(); }
    }
  } finally {
    wrap.classList.remove('streaming');
    controller = null;
    setBusy(false);
    c.updated = Date.now();
    saveChats(); renderList();
  }
}

/* ---------- Настройки ---------- */
const fields = ['claudeKey', 'claudeModel', 'groqKey', 'groqModel'];
function openSettings() {
  fields.forEach(f => $('#' + f).value = settings[f]);
  $('#settings').classList.add('open');
}
function closeSettings() { $('#settings').classList.remove('open'); }
$('#settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  fields.forEach(f => settings[f] = $('#' + f).value.trim());
  if (!settings.claudeModel) settings.claudeModel = DEFAULTS.claudeModel;
  if (!settings.groqModel) settings.groqModel = DEFAULTS.groqModel;
  LS.set('pf_settings', settings);
  setProvider(provider);
  closeSettings();
  toast('Настройки сохранены');
});
$('#closeSettings').onclick = closeSettings;
$('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
$('#openSettings').onclick = () => { closeSidebar(); openSettings(); };

/* ---------- События ---------- */
const input = $('#input');
function autoResize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
input.addEventListener('input', autoResize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
$('#sendBtn').onclick = () => controller ? controller.abort() : send(input.value);

document.querySelectorAll('#switch button').forEach(b => b.onclick = () => setProvider(b.dataset.p));

$('#newChat').onclick = () => {
  if (controller) return toast('Дождитесь окончания ответа');
  currentId = null; saveChats(); renderList(); renderChat(); closeSidebar(); input.focus();
};

async function copy(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = 'Скопировано ✓';
    setTimeout(() => btn.textContent = old, 1400);
  } catch { toast('Не удалось скопировать'); }
}
$('#messages').addEventListener('click', e => {
  const codeBtn = e.target.closest('.code-head button');
  if (codeBtn) return copy(codeBtn.closest('.code').querySelector('pre').textContent, codeBtn);
  const msgBtn = e.target.closest('.msg-copy');
  if (msgBtn) return copy(msgBtn.closest('.msg')._raw || '', msgBtn);
  const chip = e.target.closest('.chip');
  if (chip) send(chip.dataset.q);
});

function closeSidebar() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); }
$('#burger').onclick = () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); };
$('#overlay').onclick = closeSidebar;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSettings(); closeSidebar(); } });

/* ---------- Фон с частицами ---------- */
(function particles() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#bg'), ctx = cv.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let W, H, P = [];
  function init() {
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(80, Math.floor(W * H / 16000));
    P = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
      r: Math.random() * 1.6 + .4, t: Math.random() * 6.28
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.x += p.vx; p.y += p.vy; p.t += .02;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    }
    ctx.lineWidth = .6;
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, d = dx * dx + dy * dy;
      if (d < 12000) {
        ctx.strokeStyle = `rgba(217,169,69,${(1 - d / 12000) * .12})`;
        ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke();
      }
    }
    for (const p of P) {
      ctx.fillStyle = `rgba(246,221,143,${.35 + Math.sin(p.t) * .25})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', init);
  init(); frame();
})();

/* ---------- Запуск ---------- */
$('#splashLogo').innerHTML = robotSVG();
$('#sideLogo').innerHTML = robotSVG();
setProvider(provider);
renderList();
renderChat();
setTimeout(() => {
  $('#splash').classList.add('hide');
  setTimeout(() => $('#splash').remove(), 800);
}, 1600);
</script>
