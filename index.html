  radial-gradient(900px 500px at 15% -10%,rgba(70,76,150,.35),transparent 60%),
  radial-gradient(700px 500px at 100% 110%,rgba(60,50,120,.3),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}

/* header */
header{display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--sat) + 10px) 18px 10px;flex:none}
header h1{margin:0;font-size:13px;font-weight:400;letter-spacing:.42em;padding-left:.42em;color:#d9dcff}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:#c9ccf0}
.ib:active{background:var(--bubble)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* chat */
#chat{flex:1;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.welcome{margin:auto;text-align:center;padding-bottom:40px}
.lw{position:relative;width:230px;max-width:70vw;margin:0 auto -20px;-webkit-user-select:none;user-select:none}
.lw .aura{position:absolute;inset:10%;border-radius:50%;filter:blur(46px);opacity:.28;animation:breathe 4.6s ease-in-out infinite}
.lw .aura::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#f5d36b,#b8862b,#ffe9a6,#8a6420,#f5d36b);animation:spin 16s linear infinite}
.bot{display:block;width:100%;height:auto;overflow:visible}
.bot *{transform-box:fill-box;transform-origin:center}
.lw .bot{position:relative}
.bot .td{opacity:0}
.bot.live{animation:botglow 4s ease-in-out infinite}
.bot.live .rb{animation:bfloat 3.6s ease-in-out infinite}
.bot.live .head{animation:btilt 6s ease-in-out infinite;transform-origin:50% 100%}
.bot.live .eye{animation:blink 4.2s infinite}
.bot.live .ball{animation:ballp 2.4s ease-in-out infinite}
.bot.live .a2 .ball{animation-delay:1.2s}
.bot.live .heart{animation:heartb 1.8s ease-in-out infinite}
.bot.live .al{animation:swayl 3.6s ease-in-out infinite;transform-origin:100% 0}
.bot.live .ar{animation:swayr 3.6s ease-in-out infinite;transform-origin:0 0}
/* думает: когда ИИ готовит ответ */
.bot.think .rb,body.busy .msg.ai:last-child .bot .rb{animation:bfloat 1.3s ease-in-out infinite}
.bot.think .head,body.busy .msg.ai:last-child .bot .head{animation:thinktilt 2.2s ease-in-out infinite;transform-origin:50% 100%}
.bot.think .eyes,body.busy .msg.ai:last-child .bot .eyes{animation:look 2s ease-in-out infinite}
.bot.think .eye,body.busy .msg.ai:last-child .bot .eye{animation:blink 3s infinite}
.bot.think .ball,body.busy .msg.ai:last-child .bot .ball{animation:ballthink .7s ease-in-out infinite}
.bot.think .a2 .ball,body.busy .msg.ai:last-child .bot .a2 .ball{animation-delay:.35s}
.bot.think .heart,body.busy .msg.ai:last-child .bot .heart{animation:heartfast .5s ease-in-out infinite}
.bot.think .td,body.busy .msg.ai:last-child .bot .td{opacity:1}
.bot.think .td circle,body.busy .msg.ai:last-child .bot .td circle{animation:dotpop 1.4s ease-in-out infinite}
.bot .td circle:nth-child(2){animation-delay:.25s!important}
.bot .td circle:nth-child(3){animation-delay:.5s!important}
@keyframes botglow{0%,100%{filter:drop-shadow(0 0 10px rgba(230,180,70,.35))}50%{filter:drop-shadow(0 0 24px rgba(255,210,100,.6))}}
@keyframes bfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes btilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.5deg)}70%{transform:rotate(2.5deg)}}
@keyframes thinktilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes look{0%,100%{transform:translate(-5px,-2px)}25%{transform:translate(-5px,-2px)}50%{transform:translate(5px,-3px)}75%{transform:translate(5px,-3px)}}
@keyframes ballp{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes ballthink{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
@keyframes heartb{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@keyframes heartfast{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.5)}}
@keyframes swayl{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
@keyframes swayr{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes dotpop{0%,100%{opacity:.2;transform:scale(.6)}40%{opacity:1;transform:scale(1.15)}}
.lw.tap{animation:tap .7s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.28;transform:scale(.9)}50%{opacity:.62;transform:scale(1.1)}}
@keyframes float{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes hue{0%,100%{filter:hue-rotate(-20deg) saturate(1.05) brightness(1)}50%{filter:hue-rotate(30deg) saturate(1.3) brightness(1.12)}}
@keyframes tap{40%{transform:scale(1.14)}100%{transform:scale(1)}}
/* аватар: оживает, пока ИИ отвечает */
body.busy .msg.ai:last-child .avatar{box-shadow:0 0 0 0 rgba(143,152,255,.5);animation:ring 1.4s ease-out infinite}
@keyframes ring{to{box-shadow:0 0 0 14px rgba(143,152,255,0)}}
@media (prefers-reduced-motion:reduce){.bot,.bot *,.lw,.lw *,.avatar,.avatar *{animation:none!important}}
.welcome h2{margin:6px 0 8px;font-size:20px;font-weight:500}
.welcome p{margin:0;color:var(--dim);font-size:15px;line-height:1.5}
.nokey{margin-top:22px;display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bubble);font-size:14px;color:#cfd2ff}

.msg{display:flex;gap:10px;max-width:100%}
.msg.user{justify-content:flex-end}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:#12163a;border:1px solid var(--line);display:grid;place-items:center}
.avatar svg{width:25px;height:auto;overflow:visible}
.bubble{position:relative;background:var(--bubble);border:1px solid var(--line);border-radius:22px;
  padding:13px 16px 12px;font-size:15.5px;line-height:1.45;max-width:min(84%,560px);word-wrap:break-word;overflow-wrap:anywhere}
.msg.user .bubble{border-top-right-radius:10px}
.msg.ai .bubble{border-top-left-radius:10px}
.bubble .t{display:block;text-align:right;font-size:11px;color:var(--dim);margin-top:4px}
.bubble h4{margin:8px 0 4px;font-size:16px}
.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
.bubble li{margin:2px 0}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:6px}
.bubble pre{margin:8px 0;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:10px 12px;overflow-x:auto}
.bubble pre code{background:none;padding:0;white-space:pre}
.bubble.err{border-color:rgba(255,120,140,.4);color:#ffc2cb}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--accent);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* composer */
footer{flex:none;padding:8px 14px calc(var(--sab) + 12px)}
.bar{display:flex;align-items:flex-end;gap:6px;padding:7px;border-radius:30px;background:rgba(255,255,255,.055);border:1px solid rgba(160,170,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .ib{width:38px;height:38px;border-radius:50%;flex:none}
#plus{background:rgba(255,255,255,.06)}
#inp{flex:1;resize:none;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.35;padding:9px 4px;max-height:140px;min-height:38px}
#inp::placeholder{color:#6f749a}
#send{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent2);color:#fff;transition:opacity .15s}
#send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#send.idle{background:rgba(170,178,240,.8)}
#send.idle svg{stroke:#2a2f66}
header .ib.hide{visibility:hidden}
#mic.on{color:#ff8da1;background:rgba(255,120,140,.15)}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--panel);border-right:1px solid var(--line);
  transform:translateX(-102%);transition:transform .25s ease;z-index:21;display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) 14px calc(var(--sab) + 14px)}
body.open #scrim{opacity:1;pointer-events:auto}
body.open #drawer{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.dh .logo{width:32px;height:32px;border-radius:8px}
.dh b{font-weight:400;letter-spacing:.32em;font-size:13px}
.newbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--bubble);border:1px solid var(--line);font-size:15px;margin-bottom:12px}
.newbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.dl-title{font-size:12px;color:var(--dim);padding:4px 8px 6px}
#list{flex:1;overflow-y:auto}
.item{display:flex;align-items:center;border-radius:12px;padding-left:12px}
.item.act{background:rgba(143,152,255,.14)}
.item button.o{flex:1;text-align:left;padding:12px 0;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item button.x{width:38px;height:38px;color:var(--dim);font-size:20px;flex:none}
.empty{color:var(--dim);font-size:14px;padding:10px 12px}
.setbtn{display:flex;align-items:center;gap:10px;padding:13px 12px;border-top:1px solid var(--line);margin-top:8px;font-size:15px;color:#cfd2ff}
.setbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
#sheet.show{display:flex}
.card{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:#0e1124;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(var(--sab) + 20px)}
.card h3{margin:0 0 16px;font-size:18px;font-weight:500}
.card label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
.card input,.card select,.card textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;outline:0}
.card textarea{min-height:92px;resize:vertical}
.card input:focus,.card textarea:focus,.card select:focus{border-color:rgba(143,152,255,.6)}
.card a{color:var(--accent)}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.4}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:14px;background:var(--bubble);border:1px solid var(--line);text-align:center;font-size:15px}
.btn.p{background:var(--accent2);border-color:transparent;color:#fff}
.btn.d{color:#ff9aaa}
.mini{font-size:13px;color:var(--accent);padding:4px 0;margin-top:6px}

/* images */
.bubble img.pic{display:block;width:100%;border-radius:14px;margin:0 0 8px;background:rgba(255,255,255,.05);object-fit:cover}
.msg.user .bubble img.pic{width:auto;max-width:100%;max-height:280px}
.bubble img.gen{aspect-ratio:1/1;animation:sh 1.6s infinite}
.bubble img.gen.ok{animation:none}
@keyframes sh{0%,100%{opacity:.45}50%{opacity:1}}
.rt{display:inline-block;margin:0 0 8px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bubble);font-size:14px;color:#cfd2ff}
#chip{display:none;align-items:center;gap:10px;padding:0 8px 8px}
#chip.show{display:flex}
#chip img{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
#chip span{flex:1;font-size:13.5px;color:var(--dim)}
#chip button{width:32px;height:32px;border-radius:50%;background:var(--bubble);font-size:18px;color:#cfd2ff}

.card label.sw{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--text);margin:18px 0 4px}
.card .sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.card .sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.card .sw input:checked{background:var(--accent2)}
.card .sw input:checked::after{transform:translateX(20px)}
</style>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const DEFAULT_SYS = 'Ты — Pafoos AI, дружелюбный личный ИИ-помощник. Отвечай на языке пользователя, понятно и по делу.';
const DEFAULT_MODELS = ['openai/gpt-oss-120b','openai/gpt-oss-20b'];

let chats = store.get('pf_chats', []);
let curId = store.get('pf_cur', null);
let cfg = Object.assign({ key:'', model:DEFAULT_MODELS[0], system:DEFAULT_SYS, models:DEFAULT_MODELS, visionModel:'qwen/qwen3.6-27b' }, store.get('pf_cfg', {}));
function migrate(){
  if (/llama-4-scout/.test(cfg.visionModel || '')) cfg.visionModel = 'qwen/qwen3.6-27b';
  if (/llama-3\.3-70b|llama-3\.1-8b/.test(cfg.model)) cfg.model = DEFAULT_MODELS[0];
  if ((cfg.models || []).some(m => /llama-3\.3-70b|llama-3\.1-8b/.test(m))) cfg.models = DEFAULT_MODELS;
}
migrate();
let busy = false, ctrl = null, pending = null, genMode = false;

/* IndexedDB + cookie mirror: если iOS очистит localStorage, данные вернутся */
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('pafoos', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ try { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch(e){} }
async function idbGet(k){ try { const d = await idb(); return await new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch(e){ return undefined; } }
function ckSet(){ try { document.cookie = 'pf_k=' + encodeURIComponent(JSON.stringify({ key:cfg.key, model:cfg.model })) + ';max-age=31536000;path=/;SameSite=Lax'; } catch(e){} }
function ckGet(){ try { const m = document.cookie.match(/(?:^|; )pf_k=([^;]*)/); return m ? JSON.parse(decodeURIComponent(m[1])) : null; } catch(e){ return null; } }
const save = () => {
  store.set('pf_chats', chats); store.set('pf_cur', curId); store.set('pf_cfg', cfg);
  idbSet('pf_chats', chats); idbSet('pf_cur', curId); idbSet('pf_cfg', cfg); ckSet();
};
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
const cur = () => chats.find(c => c.id === curId);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const hhmm = t => new Date(t).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let _pl = 0;
function plogo(mini){
  const u = 'rb' + (++_pl), G = 'url(#' + u + 'g)';
  const st = 'stroke="' + G + '" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  return '<svg class="bot' + (mini ? '' : ' live') + '" viewBox="' + (mini ? '26 4 156 124' : '18 4 164 196') + '" aria-hidden="true">' +
  '<defs>' +
    '<linearGradient id="' + u + 'g" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="160" y2="190"><stop offset="0" stop-color="#fff2b0"/><stop offset=".35" stop-color="#e6bd57"/><stop offset=".68" stop-color="#c28f2f"/><stop offset="1" stop-color="#8d6420"/></linearGradient>' +
    '<linearGradient id="' + u + 'd" gradientUnits="userSpaceOnUse" x1="60" y1="54" x2="140" y2="102"><stop offset="0" stop-color="#c39a3c"/><stop offset="1" stop-color="#6b4a14"/></linearGradient>' +
  '</defs>' +
  '<g class="rb">' +
    '<g class="head">' +
      '<g class="ant a1"><path d="M72,42 L60,24" stroke-width="3.5" ' + st + '/><circle class="ball" cx="58" cy="21" r="4.6" fill="' + G + '"/></g>' +
      '<g class="ant a2"><path d="M128,42 L140,24" stroke-width="3.5" ' + st + '/><circle class="ball" cx="142" cy="21" r="4.6" fill="' + G + '"/></g>' +
      '<rect x="38" y="64" width="12" height="28" rx="6" fill="' + G + '"/>' +
      '<rect x="150" y="64" width="12" height="28" rx="6" fill="' + G + '"/>' +
      '<rect x="50" y="40" width="100" height="76" rx="30" fill="#07070a" stroke="' + G + '" stroke-width="4.5"/>' +
      '<rect x="62" y="54" width="76" height="48" rx="22" fill="url(#' + u + 'd)"/>' +
      '<g class="eyes">' +
        '<g class="eye"><ellipse cx="83" cy="78" rx="11" ry="9" fill="#07070a"/><circle cx="86.5" cy="75" r="2.2" fill="#ffe9a6" opacity=".9"/></g>' +
        '<g class="eye"><ellipse cx="117" cy="78" rx="11" ry="9" fill="#07070a"/><circle cx="120.5" cy="75" r="2.2" fill="#ffe9a6" opacity=".9"/></g>' +
      '</g>' +
      '<g class="td" fill="' + G + '"><circle cx="160" cy="40" r="2.4"/><circle cx="168" cy="29" r="3.2"/><circle cx="177" cy="15" r="4.4"/></g>' +
    '</g>' +
    (mini ? '' :
    '<path d="M72,130 Q100,122 128,130 L122,168 Q100,176 78,168 Z" stroke-width="4" ' + st + '/>' +
    '<circle class="heart" cx="100" cy="148" r="6" fill="' + G + '"/>' +
    '<path d="M86,178 A14,14 0 0 0 114,178 Z" fill="' + G + '"/>' +
    '<g class="arm al"><path d="M74,138 C52,140 46,156 48,174" stroke-width="3.5" ' + st + '/><circle cx="48" cy="179" r="5" fill="' + G + '"/></g>' +
    '<g class="arm ar"><path d="M126,138 C148,140 154,156 152,174" stroke-width="3.5" ' + st + '/><circle cx="152" cy="179" r="5" fill="' + G + '"/></g>') +
  '</g></svg>';
}

function md(t){
  const blocks = [];
  t = t.replace(/```[\w+-]*\n?([\s\S]*?)(```|$)/g, (m, c) => { blocks.push(c.replace(/\n$/, '')); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  t = esc(t)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/^#{1,4} (.+)$/gm, '<h4>$1</h4>')
    .replace(/^(?:[-*] .+(?:\n|$))+/gm, m => '<ul>' + m.trim().split('\n').map(x => '<li>' + x.replace(/^[-*] /, '') + '</li>').join('') + '</ul>')
    .replace(/^(?:\d+\. .+(?:\n|$))+/gm, m => '<ol>' + m.trim().split('\n').map(x => '<li>' + x.replace(/^\d+\. /, '') + '</li>').join('') + '</ol>')
    .replace(/\n/g, '<br>')
    .replace(/<\/(h4|ul|ol)><br>/g, '</$1>')
    .replace(/<br>(<(h4|ul|ol))/g, '$1');
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => '<pre><code>' + esc(blocks[i]) + '</code></pre>');
}

/* ---------- render ---------- */
const chatEl = $('#chat');
function welcome(){
  const hasKey = !!cfg.key;
  chatEl.innerHTML = `<div class="welcome">
    <div class="lw" id="lw"><div class="aura"></div>${plogo(false)}</div>
    <h2>Привет!</h2>
    <p>Я твой личный ИИ-помощник.<br>Спроси меня о чём угодно.</p>
    ${hasKey ? '' : '<button class="nokey" id="w-key">Добавить Groq API ключ</button>'}
  </div>`;
  const b = $('#w-key'); if (b) b.onclick = openSettings;
  const lw = $('#lw'); if (lw) lw.onclick = () => { lw.classList.remove('tap'); void lw.offsetWidth; lw.classList.add('tap'); };
}
function msgEl(m){
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
  const av = m.role === 'user' ? '' : '<div class="avatar">' + plogo(true) + '</div>';
  d.innerHTML = av + '<div class="bubble' + (m.err ? ' err' : '') + '"></div>';
  fillBubble(d.querySelector('.bubble'), m);
  return d;
}
function fillBubble(b, m){
  let pre = '';
  if (m.imgs && m.imgs.length) pre += m.imgs.map(id => '<img class="pic" data-id="' + id + '" alt="">').join('');
  if (m.gen) pre += '<img class="pic gen" src="' + esc(m.gen) + '" alt="">';
  const txt = m.content || '';
  const body = m.role === 'user' ? esc(txt).replace(/\n/g, '<br>') : md(txt);
  b.innerHTML = pre + body + (m.t ? '<span class="t">' + hhmm(m.t) + '</span>' : '');
  if (pre) hookImgs(b);
}
function stickBottom(){ if (chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 600) chatEl.scrollTop = chatEl.scrollHeight; }
function hookImgs(b){
  b.querySelectorAll('img.pic[data-id]').forEach(im => {
    im.onload = stickBottom;
    getImg(im.dataset.id).then(s => { if (s) im.src = s; else im.remove(); });
  });
  b.querySelectorAll('img.gen').forEach(im => {
    im.onload = () => { im.classList.add('ok'); stickBottom(); };
    im.onerror = () => {
      const r = document.createElement('button'); r.className = 'rt'; r.textContent = 'Не загрузилось. Повторить';
      r.onclick = () => {
        let u; try { u = new URL(im.src); u.searchParams.set('r', Date.now()); } catch(e){ return; }
        const n = document.createElement('img'); n.className = 'pic gen'; n.alt = ''; n.src = u.toString();
        r.replaceWith(n); hookImgs(b);
      };
      im.replaceWith(r);
    };
  });
}
function inChat(){ const c = cur(); return !!(c && c.messages.length); }
function syncUI(){
  const ch = inChat();
  if (!(typeof mr !== 'undefined' && mr && mr.state === 'recording')) $('#inp').placeholder = genMode ? 'Опиши, что нарисовать...' : (ch ? 'Сообщение...' : 'Спросите о чём угодно...');
  const mic = $('#mic'); if (mic) mic.style.display = window.__sr ? '' : 'none';
  const hide = !ch && !chats.length;
  $('#menu').classList.toggle('hide', hide); $('#new').classList.toggle('hide', hide);
  $('#send').classList.toggle('idle', !ch && !busy && !pending && !$('#inp').value.trim());
}
function renderChat(){
  syncUI();
  const c = cur();
  if (!c || !c.messages.length) { welcome(); return; }
  chatEl.innerHTML = '';
  c.messages.forEach(m => chatEl.appendChild(msgEl(m)));
  chatEl.scrollTop = chatEl.scrollHeight;
}
function renderList(){
  const l = $('#list');
  if (!chats.length) { l.innerHTML = '<div class="empty">Пока пусто</div>'; return; }
  l.innerHTML = '';
  [...chats].sort((a, b) => b.updated - a.updated).forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === curId ? ' act' : '');
    d.innerHTML = '<button class="o"></button><button class="x" aria-label="Удалить">×</button>';
    d.querySelector('.o').textContent = c.title;
    d.querySelector('.o').onclick = () => { if (busy) stop(); curId = c.id; save(); renderChat(); renderList(); closeDrawer(); };
    d.querySelector('.x').onclick = () => {
      if (!confirm('Удалить чат?')) return;
      chats = chats.filter(x => x.id !== c.id);
      if (curId === c.id) curId = null;
      save(); renderChat(); renderList();
    };
    l.appendChild(d);
  });
}

/* ---------- chat logic ---------- */
function newChat(){
  if (busy) stop();
  curId = null; save(); renderChat(); renderList(); closeDrawer(); $('#inp').focus();
}
function stop(){ if (ctrl) ctrl.abort(); }
function setBusy(v){
  busy = v; document.body.classList.toggle('busy', v); syncUI();
  $('#send').innerHTML = v
    ? '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="#fff" stroke="none"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
}

/* ---- картинки: хранение, сжатие ---- */
const imgCache = new Map();
async function putImg(id, d){ imgCache.set(id, d); idbSet('img_' + id, d); }
async function getImg(id){ if (imgCache.has(id)) return imgCache.get(id); const v = await idbGet('img_' + id); if (v) imgCache.set(id, v); return v; }
function fileToDataUrl(file, max){
  max = max || 1280;
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      let w = im.naturalWidth, h = im.naturalHeight; const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(im, 0, 0, w, h); URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.85));
    };
    im.onerror = () => rej(new Error('Не удалось открыть фото'));
    im.src = url;
  });
}
function syncChips(){
  $('#chip').classList.toggle('show', !!(pending || genMode));
  const ci = $('#chip-img'); ci.style.display = pending ? '' : 'none'; if (pending) ci.src = pending.data;
  $('#chip-t').textContent = pending ? 'Фото прикреплено. Спроси о нём или попроси прочитать текст' : (genMode ? 'Режим: создание картинки' : '');
  syncUI();
}

const GEN_RE = /^\s*(?:нарисуй(?:те)?(?=[\s:,]|$)|draw(?=[\s:,]|$)|imagine(?=[\s:,]|$)|(?:сгенерируй|создай|сделай|generate|make|create)(?:те)?\s+(?:мне\s+)?(?:новую\s+)?(?:картинку|изображение|фото|фотографию|рисунок|арт|image|picture|photo)(?=[\s:,]|$))[:,]?\s*/i;

async function enhancePrompt(p, signal){
  try {
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST', signal,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify({ model: cfg.model, stream:false, max_tokens:1200, messages:[
        { role:'system', content:'You write prompts for an AI image generator. Translate the user request to English and expand it into one vivid, detailed prompt (subject, style, lighting, composition). Output only the prompt, no quotes, no explanations. Max 60 words.' },
        { role:'user', content:p } ] })
    });
    if (!r.ok) return p;
    const j = await r.json();
    return ((j.choices && j.choices[0] && j.choices[0].message.content) || '').trim() || p;
  } catch(e){ if (e.name === 'AbortError') throw e; return p; }
}

async function generateImage(c, text){
  const am = { role:'assistant', content:'', t:Date.now() };
  const el = msgEl(am);
  el.querySelector('.bubble').innerHTML = '<span class="dots"><span></span><span></span><span></span></span> Рисую...';
  chatEl.appendChild(el); chatEl.scrollTop = chatEl.scrollHeight;
  ctrl = new AbortController(); setBusy(true);
  try {
    let p = text.replace(GEN_RE, '').trim() || text;
    p = await enhancePrompt(p, ctrl.signal);
    const seed = Math.floor(Math.random() * 1e9);
    am.gen = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(p) + '?width=1024&height=1024&model=flux&nologo=true&seed=' + seed;
    am.prompt = p; am.t = Date.now();
    c.messages.push(am);
  } catch(e){
    if (e.name !== 'AbortError') c.messages.push({ role:'assistant', content:e.message || 'Не удалось создать картинку.', t:Date.now(), err:true });
  } finally {
    ctrl = null; setBusy(false); c.updated = Date.now(); save(); renderChat(); renderList();
  }
}

async function listModels(){
  try {
    const r = await fetch('https://api.groq.com/openai/v1/models', { headers:{ Authorization:'Bearer ' + cfg.key } });
    if (!r.ok) return [];
    const j = await r.json();
    return j.data.map(m => m.id);
  } catch(e){ return []; }
}
function visionOrder(ids){
  const pref = ['qwen/qwen3.6-27b', 'meta-llama/llama-4-scout-17b-16e-instruct', 'meta-llama/llama-4-maverick-17b-128e-instruct'];
  const rest = ids.filter(id => !pref.includes(id) && !/whisper|tts|guard|playai|orpheus|compound|gpt-oss|allam|embed/i.test(id));
  const vis = rest.filter(id => /vision|vl|scout|maverick|qwen|kimi|gemma|mistral/i.test(id));
  return [...pref.filter(p => ids.includes(p)), ...vis, ...rest.filter(id => !vis.includes(id))];
}
async function pickVision(){
  try {
    const r = await fetch('https://api.groq.com/openai/v1/models', { headers:{ Authorization:'Bearer ' + cfg.key } });
    if (!r.ok) return null;
    const j = await r.json();
    const ids = j.data.map(m => m.id);
    const pref = ['meta-llama/llama-4-scout-17b-16e-instruct', 'qwen/qwen3.6-27b', 'meta-llama/llama-4-maverick-17b-128e-instruct'];
    return pref.find(p => ids.includes(p)) || ids.find(id => /scout|maverick|vision|qwen3\.6|qwen.*vl/i.test(id)) || null;
  } catch(e){ return null; }
}

async function pickModel(){
  try {
    const r = await fetch('https://api.groq.com/openai/v1/models', { headers:{ Authorization:'Bearer ' + cfg.key } });
    if (!r.ok) return null;
    const j = await r.json();
    const ids = j.data.map(m => m.id).filter(id => !/whisper|tts|guard|playai|orpheus|compound/i.test(id)).sort();
    if (ids.length) cfg.models = ids;
    const pref = ['openai/gpt-oss-120b', 'openai/gpt-oss-20b'];
    return pref.find(p => ids.includes(p)) || ids[0] || null;
  } catch(e){ return null; }
}

async function send(){
  if (busy) { stop(); return; }
  const inp = $('#inp');
  const text = inp.value.trim();
  if (!text && !pending) return;
  if (!cfg.key) { openSettings(); return; }
  const speakIt = voiceNext || cfg.speakAll; voiceNext = false;
  const att = pending; pending = null;
  const wantGen = !att && (genMode || GEN_RE.test(text));
  genMode = false; syncChips();
  try { speechSynthesis.cancel(); } catch(e){}

  let c = cur();
  if (!c) {
    c = { id: uid(), title: (text || 'Фото').slice(0, 40), messages: [], updated: Date.now() };
    chats.push(c); curId = c.id;
  }
  const um = { role:'user', content:text, t:Date.now() };
  if (att) um.imgs = [att.id];
  c.messages.push(um);
  c.updated = Date.now();
  inp.value = ''; autosize();
  save(); renderChat(); renderList();
  if (wantGen) { await generateImage(c, text); return; }

  const am = { role:'assistant', content:'', t:Date.now() };
  const el = msgEl(am);
  const bub = el.querySelector('.bubble');
  bub.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  chatEl.appendChild(el); chatEl.scrollTop = chatEl.scrollHeight;

  const slice = c.messages.filter(m => !m.err).slice(-30);
  let lastImgIdx = -1; slice.forEach((m, i) => { if (m.imgs && m.imgs.length) lastImgIdx = i; });
  const history = []; let useVision = false;
  for (let i = 0; i < slice.length; i++) {
    const m = slice[i];
    if (m.gen) { history.push({ role:'assistant', content:'[Я создал картинку по запросу: ' + (m.prompt || '') + ']' }); continue; }
    if (m.imgs && m.imgs.length) {
      const t = m.content || 'Опиши, что на фото. Если на нём есть текст, прочитай его.';
      if (i === lastImgIdx) {
        const d = await getImg(m.imgs[0]);
        if (d) { history.push({ role:'user', content:[{ type:'text', text:t }, { type:'image_url', image_url:{ url:d } }] }); useVision = true; continue; }
      }
      history.push({ role:'user', content:'[Пользователь прислал фото] ' + (m.content || '') }); continue;
    }
    history.push({ role:m.role, content:m.content });
  }
  const payload = { model: useVision ? cfg.visionModel : cfg.model, stream: true, messages: [{ role:'system', content: cfg.system || DEFAULT_SYS }, ...history] };

  ctrl = new AbortController();
  setBusy(true);
  let full = '', visionIds = [];
  try {
    const doFetch = () => fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + cfg.key },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    let res = await doFetch();
    if (!res.ok && (res.status === 404 || res.status === 400)) {
      if (useVision) {
        visionIds = await listModels();
        const tried = new Set([payload.model]);
        for (const cand of visionOrder(visionIds)) {
          if (tried.has(cand)) continue;
          if (tried.size > 7) break;
          tried.add(cand); payload.model = cand;
          res = await doFetch();
          if (res.ok) { cfg.visionModel = cand; save(); break; }
          if (res.status !== 404 && res.status !== 400) break;
        }
      } else {
        const alt = await pickModel();
        if (alt && alt !== payload.model) { cfg.model = alt; save(); payload.model = alt; res = await doFetch(); }
      }
    }
    if (!res.ok) {
      let msg = 'Ошибка ' + res.status;
      try { const j = await res.json(); msg = (j.error && j.error.message) || msg; } catch(e){}
      if (useVision && (res.status === 404 || res.status === 400)) msg = 'Не нашёл модель Groq, которая принимает фото' + (visionIds.length ? '. Доступные модели: ' + visionIds.join(', ') : '') + '. Попробуй выбрать другую в Настройках, поле «Модель для фото».';
      if (res.status === 401) msg = 'Неверный API ключ. Проверь его в настройках.';
      if (res.status === 429) msg = 'Превышен лимит запросов Groq. Подожди немного и повтори.';
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data:')) continue;
        const d = l.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (delta) {
            full += delta;
            fillBubble(bub, { role:'assistant', content:full });
            const near = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 140;
            if (near) chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch(e){}
      }
    }
    if (!full) throw new Error('Пустой ответ от модели.');
    am.content = full; am.t = Date.now();
    c.messages.push(am);
    if (speakIt) speak(full);
  } catch (e) {
    if (e.name === 'AbortError') {
      if (full) { am.content = full; am.t = Date.now(); c.messages.push(am); }
      else { el.remove(); }
    } else {
      const msg = (e instanceof TypeError) ? 'Нет соединения с Groq. Проверь интернет.' : e.message;
      const em = { role:'assistant', content:msg, t:Date.now(), err:true };
      c.messages.push(em);
    }
  } finally {
    ctrl = null; setBusy(false);
    c.updated = Date.now(); save(); renderChat(); renderList();
  }
}

/* ---------- composer ---------- */
const inp = $('#inp');
function autosize(){ inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 140) + 'px'; }
inp.addEventListener('input', () => { autosize(); syncUI(); });
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); }
});
$('#send').onclick = send;

// ---- голосовой режим: запись -> Whisper (Groq) -> ответ -> озвучка ----
let mr = null, chunks = [], stream = null, voiceNext = false;
const canRec = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
window.__sr = canRec;
const mic = $('#mic');

function unlockTTS(){
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
}
function speak(t){
  if (!('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); } catch(e){}
  t = t.replace(/```[\s\S]*?```/g, ' Код я пропускаю. ').replace(/[*_#`>|]/g, '').replace(/\s+/g, ' ').trim();
  if (!t) return;
  const ru = /[а-яё]/i.test(t), lang = ru ? 'ru' : 'en';
  const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
  const v = voices.find(v => /milena|yuri|enhanced|premium|siri/i.test(v.name)) || voices[0];
  (t.match(/[^.!?\n]+[.!?]*/g) || [t]).forEach(s => {
    s = s.trim(); if (!s) return;
    const u = new SpeechSynthesisUtterance(s);
    u.lang = ru ? 'ru-RU' : 'en-US'; if (v) u.voice = v; u.rate = 1;
    speechSynthesis.speak(u);
  });
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

async function transcribe(blob, type){
  const ext = type.includes('webm') ? 'webm' : type.includes('mp4') ? 'm4a' : 'ogg';
  let lastErr = 'Не удалось распознать речь';
  for (const model of ['whisper-large-v3-turbo', 'whisper-large-v3']) {
    const fd = new FormData();
    fd.append('file', blob, 'audio.' + ext); fd.append('model', model); fd.append('language', 'ru'); fd.append('response_format', 'json');
    const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method:'POST', headers:{ Authorization:'Bearer ' + cfg.key }, body: fd });
    if (r.ok) { const j = await r.json(); return (j.text || '').trim(); }
    let m = 'Ошибка ' + r.status; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch(e){}
    lastErr = m;
    if (r.status !== 404 && r.status !== 400) break;
  }
  throw new Error(lastErr);
}

if (canRec) {
  mic.onclick = async () => {
    unlockTTS();
    try { if (speechSynthesis.speaking) speechSynthesis.cancel(); } catch(e){}
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    if (busy) return;
    if (!cfg.key) { openSettings(); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(e){ alert('Нет доступа к микрофону. Разреши его: Настройки iPhone → Safari → Микрофон.'); return; }
    const mime = ['audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    mr = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
    chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      mic.classList.remove('on');
      const type = (mr && mr.mimeType) || mime || 'audio/mp4';
      const blob = new Blob(chunks, { type }); mr = null;
      syncUI();
      if (blob.size < 2000) return;
      inp.placeholder = 'Распознаю речь...';
      try {
        const text = await transcribe(blob, type);
        syncUI();
        if (!text) return;
        inp.value = text; autosize(); voiceNext = true; send();
      } catch(e){ syncUI(); alert('Не удалось распознать речь: ' + e.message); }
    };
    mr.start(); mic.classList.add('on');
    inp.placeholder = 'Слушаю... нажми ещё раз, когда закончишь';
  };
}

/* ---------- фото ---------- */
$('#plus').onclick = () => $('#file').click();
$('#chip-x').onclick = () => { pending = null; genMode = false; syncChips(); };
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = await fileToDataUrl(f); const id = uid(); await putImg(id, d); pending = { id, data:d }; genMode = false; syncChips(); inp.focus(); }
  catch(err){ alert(err.message || 'Не удалось открыть фото'); }
};

/* ---------- drawer ---------- */
const openDrawer = () => { renderList(); document.body.classList.add('open'); };
const closeDrawer = () => document.body.classList.remove('open');
$('#menu').onclick = openDrawer;
$('#scrim').onclick = closeDrawer;
$('#new').onclick = newChat;
$('#d-new').onclick = newChat;
$('#d-set').onclick = () => { closeDrawer(); openSettings(); };

/* ---------- settings ---------- */
function fillModels(list, selected, id){
  const sel = $(id || '#s-model');
  const all = list.includes(selected) ? list : [selected, ...list];
  sel.innerHTML = all.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>').join('');
  sel.value = selected;
}
function storageStatus(){
  let ls = false;
  try { localStorage.setItem('pf_t', '1'); ls = localStorage.getItem('pf_t') === '1'; localStorage.removeItem('pf_t'); } catch(e){}
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  $('#s-store').textContent = 'Хранилище: ' + (ls ? 'работает' : 'НЕ работает (отключи приватный режим Safari)') + ' · ' + (standalone ? 'открыто с экрана «Домой»' : 'открыто во вкладке Safari');
}
function openSettings(){
  $('#s-speak').checked = !!cfg.speakAll;
  storageStatus();
  $('#s-key').value = cfg.key;
  $('#s-sys').value = cfg.system;
  fillModels(cfg.models, cfg.model);
  fillModels(cfg.allModels || [cfg.visionModel], cfg.visionModel, '#s-vmodel');
  $('#sheet').classList.add('show');
}
const closeSettings = () => $('#sheet').classList.remove('show');
$('#s-cancel').onclick = closeSettings;
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSettings(); });
$('#s-save').onclick = () => {
  cfg.key = $('#s-key').value.trim();
  cfg.model = $('#s-model').value;
  cfg.visionModel = $('#s-vmodel').value;
  cfg.system = $('#s-sys').value.trim() || DEFAULT_SYS;
  save(); closeSettings();
  if (!cur() || !cur().messages.length) welcome();
};
$('#s-refresh').onclick = async () => {
  const key = $('#s-key').value.trim();
  const btn = $('#s-refresh');
  if (!key) { btn.textContent = 'Сначала введи ключ'; return; }
  btn.textContent = 'Загружаю...';
  try {
    const r = await fetch('https://api.groq.com/openai/v1/models', { headers:{ Authorization:'Bearer ' + key } });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const ids = j.data.map(m => m.id).filter(id => !/whisper|tts|guard|playai|orpheus/i.test(id)).sort();
    cfg.models = ids;
    cfg.allModels = j.data.map(m => m.id).sort();
    fillModels(ids, $('#s-model').value);
    fillModels(cfg.allModels, $('#s-vmodel').value, '#s-vmodel');
    btn.textContent = 'Список обновлён (' + ids.length + ')';
  } catch(e){
    btn.textContent = 'Не получилось. Проверь ключ и интернет';
  }
};
$('#s-speak').onchange = e => { cfg.speakAll = e.target.checked; save(); unlockTTS(); if (!cfg.speakAll) { try { speechSynthesis.cancel(); } catch(x){} } };
$('#s-gen').onclick = () => { closeSettings(); genMode = true; pending = null; syncChips(); inp.focus(); };
$('#s-clear').onclick = () => {
  const c = cur(); if (!c) { closeSettings(); return; }
  if (!confirm('Очистить этот чат?')) return;
  chats = chats.filter(x => x.id !== c.id); curId = null; save(); renderChat(); renderList(); closeSettings();
};
$('#s-wipe').onclick = () => {
  if (!confirm('Удалить всю историю чатов?')) return;
  chats = []; curId = null; save(); renderChat(); renderList(); closeSettings();
};

/* ---------- init ---------- */
(async () => {
  if (!chats.length && !cfg.key) {
    const c = await idbGet('pf_chats'), g = await idbGet('pf_cfg'), u = await idbGet('pf_cur');
    if (c && c.length) chats = c;
    if (u) curId = u;
    if (g) cfg = Object.assign(cfg, g);
    else { const k = ckGet(); if (k) cfg = Object.assign(cfg, k); }
    migrate();
  }
  if (!cur()) curId = null;
  renderChat(); renderList();
})();
</script>
